name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to retry publishing (e.g. v0.1.0); leave empty to run Release Please'
        required: false
        type: string

# Never cancel a run while it is uploading release assets.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release-please:
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [ci, release-please]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag such as v0.1.0'
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify tagged source
        run: |
          go test -race ./...
          go vet ./...
      # GITHUB_TOKEN-created release events cannot trigger another workflow.
      - name: Build and publish release assets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens a reviewed version/checksum PR in viaductindustries/homebrew-tap.
  # After fixing a failure, re-run only this job; the release is unaffected.
  update-homebrew:
    needs: [release-please, publish]
    if: always() && !cancelled() && needs.publish.result == 'success'
    permissions:
      contents: read
    uses: viaductindustries/homebrew-tap/.github/workflows/update-package.yml@6f7ce3e6feb6cf815160d681efb7382bf3638262 # main
    with:
      package: ghsecretsync
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      app-client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
    secrets:
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
